<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EchaBot</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="app-shell">
      <div id="backdrop" class="backdrop" aria-hidden="true"></div>

      <aside class="sidebar" aria-label="Sidebar">
        <div class="sidebar-header">
          <img src="/static/logo.png" alt="EchaBot Logo" class="sidebar-logo">
          <div>
            <p class="eyebrow">AI Data Analyst</p>
            <h1>EchaBot</h1>
          </div>
        </div>
        <p class="subtitle">Chatbot analisis dan visualisasi data penjualan.</p>

        <section class="upload-panel">
          <label for="dataset">Upload Dataset</label>
          <input id="dataset" type="file" accept=".csv,.xlsx,.xls">
          <button id="uploadBtn" type="button">Upload</button>
          <button id="sampleBtn" type="button" class="secondary">Pakai Sample Walmart</button>
        </section>

        <section class="status-panel">
          <h2>Dataset</h2>
          <p id="datasetStatus">Belum ada dataset aktif.</p>
          <div id="datasetMeta" class="meta-grid"></div>
        </section>
      </aside>

      <section class="chat-panel">
        <header class="topbar">
          <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Buka menu">
            <span class="icon-lines" aria-hidden="true"></span>
          </button>
          <div class="topbar-title">
            <div class="topbar-name">EchaBot</div>
            <div class="topbar-subtitle">AI Data Analyst</div>
          </div>
        </header>

        <div id="messages" class="messages">
          <div class="message bot">
            <p>Halo, gue EchaBot. Upload dataset dulu, terus lo bisa minta ringkasan, grafik per tahun, per bulan, per store, heatmap, atau evaluasi model.</p>
          </div>
        </div>

        <form id="chatForm" class="composer">
          <input id="messageInput" autocomplete="off" placeholder="Contoh: tampilkan grafik penjualan per bulan">
          <button id="sendBtn" type="submit" aria-label="Kirim">
            <svg id="sendIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            <svg id="stopIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
